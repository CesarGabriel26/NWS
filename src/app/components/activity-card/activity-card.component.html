<article
    class="flex min-h-80 flex-col rounded-lg border border-l-4 border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
    [ngClass]="activity.presentation.border">
    <div class="flex items-start justify-between gap-4">
        <span class="inline-flex items-center gap-2 rounded-md px-2.5 py-1 text-xs font-black ring-1"
            [ngClass]="activity.presentation.badge">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">
                {{ activity.presentation.icon }}
            </span>
            {{ activity.presentation.label }}
        </span>

        <span class="text-sm font-black text-slate-500">{{ activity.xp }} XP</span>
    </div>

    <h3 class="mt-5 text-xl font-black text-slate-950">{{ activity.title }}</h3>
    <p class="mt-2 flex-1 text-sm leading-6 text-slate-600">{{ activity.description }}</p>

    <div class="mt-4 flex flex-wrap gap-2">
        <span class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-600">
            {{ activity.subject.name }}
        </span>
        <span class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-600">
            {{ activity.topic }}
        </span>
        <!-- <span class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-600">
            {{ getDifficultyLabel(activity.difficulty) }}
        </span> -->
    </div>

    <div class="mt-5">
        <div class="flex items-center justify-between text-xs font-bold text-slate-500">
            <span>{{ activity.durationMinutes }} min</span>
            <span>{{ activity.progress }}%</span>
        </div>
        <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100">
            <div class="h-full rounded-full" [ngClass]="activity.presentation.progress"
                [style.width.%]="activity.progress"></div>
        </div>
    </div>

    <button (click)="onAction()"
        class="mt-5 inline-flex items-center justify-center gap-2 rounded-md px-4 py-3 text-sm font-black outline-none transition focus-visible:ring-2 focus-visible:ring-offset-2"
        [ngClass]="activity.presentation.button" type="button">
        {{ activity.presentation.action }}
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">
            arrow_forward
        </span>
    </button>
</article>
